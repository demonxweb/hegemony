<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hegemony · SVG 素材預覽</title>
<style>
  body { margin: auto; max-width: 1100px; padding: 32px clamp(14px, 4vw, 48px); background: #10151d; color: #f0f3f8; font: 16px/1.6 Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif; }
  h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2.5rem); }
  h2 { margin: 1.5em 0 .45em; font-size: 1.25rem; }
  p { color: #b9c3d0; }
  ul { padding: 0; list-style: none; display: grid; gap: 16px; }
  .cards { grid-template-columns: repeat(auto-fit, minmax(min(100%, 225px), 1fr)); }
  .cards img { width: 100%; display: block; }
  .icons { grid-template-columns: repeat(auto-fit, minmax(86px, 1fr)); }
  .icons li { background: #1b2330; border-radius: 10px; padding: 12px 5px; text-align: center; }
  .icons img { display: block; width: 30px; margin: 0 auto 6px; }
  a:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  .cards a { display: block; border-radius: 15px; }
</style>
<main>
  <h1>Hegemony · SVG 素材預覽</h1>
  <p>四角色行動卡、企業卡與事件卡的視覺原型。點選卡片可查看獨立 SVG。</p>
  <h2>資源與狀態圖示</h2>
  <ul class="icons"><li><img src="icons/food.svg" alt=""><span>食物</span></li><li><img src="icons/luxury.svg" alt=""><span>奢侈品</span></li><li><img src="icons/health.svg" alt=""><span>醫療</span></li><li><img src="icons/education.svg" alt=""><span>教育</span></li><li><img src="icons/influence.svg" alt=""><span>影響力</span></li><li><img src="icons/money.svg" alt=""><span>金錢</span></li><li><img src="icons/worker.svg" alt=""><span>工人</span></li><li><img src="icons/vote.svg" alt=""><span>投票</span></li><li><img src="icons/legitimacy.svg" alt=""><span>合法性</span></li><li><img src="icons/machinery.svg" alt=""><span>機械</span></li></ul>
  <h2>卡面</h2>
  <ul class="cards"><li><a href="cards/working-state-scholarship.svg"><img src="cards/working-state-scholarship.svg" alt="國家獎學金"></a></li><li><a href="cards/middle-import-subsidy.svg"><img src="cards/middle-import-subsidy.svg" alt="進口補貼"></a></li><li><a href="cards/capitalist-offshore-companies.svg"><img src="cards/capitalist-offshore-companies.svg" alt="境外公司"></a></li><li><a href="cards/state-pressing-matters.svg"><img src="cards/state-pressing-matters.svg" alt="緊急議案"></a></li><li><a href="cards/company-supermarket.svg"><img src="cards/company-supermarket.svg" alt="超市"></a></li><li><a href="cards/event-low-education-index.svg"><img src="cards/event-low-education-index.svg" alt="教育指數偏低"></a></li></ul>
</main>
</html>
