<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 500" role="img" aria-labelledby="title desc">
  <title id="title">進口補貼 · 行動卡 · 中產</title>
  <desc id="desc">前提，外貿政策 6A 或 6B。效果，向外國市場購入食物或奢侈品。，最多等同人口，免關稅。。合法性，每買 4 單位，中產 +1</desc>
