    </pattern>
  </defs>
  <rect x="1" y="1" width="338" height="498" rx="20" fill="url(#base)" stroke="#f0c177" stroke-width="2"/>
  <g font-family="Segoe UI, Microsoft JhengHei, Noto Sans TC, sans-serif">
